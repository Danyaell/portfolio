@if (featuredProjects.length > 0) {
  <section aria-labelledby="featured-projects-title" class="w-full">
    <div class="site-container pb-16 md:pb-20 lg:pb-24">
      <div class="mb-8 flex flex-col gap-5 md:flex-row md:items-end md:justify-between">
        <div class="max-w-2xl">
          <h2 id="featured-projects-title" class="mt-2">Featured projects</h2>

          <p class="mt-3 text-ink-muted">
            Applications I'm proud of demonstrating product engineering across frontend, backend,
            testing and delivery.
          </p>
        </div>

        <a
          routerLink="/projects"
          class="inline-flex min-h-11 w-fit items-center font-semibold text-ink transition-colors duration-fast hover:text-brand-violet"
        >
          View all projects
          <span aria-hidden="true" class="ml-1">→</span>
        </a>
      </div>

      <ul class="grid grid-cols-1 gap-6 lg:grid-cols-2">
        @for (project of featuredProjects; track project.slug) {
          <li class="min-w-0">
            <dml-project-card [project]="project" />
          </li>
        }
      </ul>
    </div>
  </section>
}
