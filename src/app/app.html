<div #appShell class="relative isolate min-h-dvh w-full [--pointer-x:50vw] [--pointer-y:28vh]">
  <div aria-hidden="true" class="app-ambient pointer-events-none fixed inset-0 z-0"></div>

  <div aria-hidden="true" class="app-grid pointer-events-none fixed inset-0 z-0"></div>
  <div class="relative z-10 flex min-h-dvh w-full flex-col">
    <a
      href="#main-content"
      class="fixed top-4 left-4 z-60 -translate-y-24 rounded-button bg-surface-raised px-4 py-3 font-semibold text-ink transition-transform duration-fast focus:translate-y-0"
    >
      Skip to main content
    </a>

    <dml-site-header />

    <main #mainContent id="main-content" tabindex="-1" class="flex w-full flex-1">
      <router-outlet />
    </main>

    <dml-site-footer />
  </div>
</div>
